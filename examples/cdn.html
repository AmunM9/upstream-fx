<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upstream — plain HTML example</title>
    <!-- In production: https://cdn.jsdelivr.net/npm/upstream-fx/dist/upstream.global.js -->

    <style>
      body { margin: 0; font-family: system-ui, sans-serif; color: #fff; background: #000; }
